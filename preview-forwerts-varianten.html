<style>
:root{color-scheme:dark;--bg:#101017;--text:#eeeaf0;--muted:#aaa6b0;--line:#34323c;--accent:#d89b7b;--serif:Fraunces,Georgia,serif;--sans:Inter,Arial,sans-serif;--mono:'Space Grotesk',monospace}
*{box-sizing:border-box}body{margin:0;background:#08080d;color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:5px}button{border:0}figure,h1,h2,h3,p{margin:0}img{display:block;width:100%}button[aria-pressed=true]{color:var(--text)}
.review{padding:24px max(24px,calc((100% - 1180px)/2));border-bottom:1px solid var(--line);background:#14141c}.review__top{display:flex;align-items:center;justify-content:space-between;gap:20px}.review__top>p{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}.lang{background:transparent;padding:8px;color:var(--muted);font-size:12px}.choices{display:flex;gap:10px;margin-top:18px}.choice{flex:1;text-align:left;padding:15px 18px;background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--muted)}.choice[aria-pressed=true]{border-color:var(--accent);background:#211b1b}.choice b{font-size:14px;font-weight:500}.choice small{display:block;font-size:11px;margin-top:5px}.rationale{font-size:13px;color:var(--muted);margin-top:16px;max-width:850px}.canvas{width:min(1100px,100% - 48px);margin:38px auto 70px;padding:clamp(26px,5vw,70px);background:var(--bg);border:1px solid var(--line);border-radius:10px}.eyebrow{font:400 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}h1{font:350 clamp(48px,6.5vw,84px)/1.04 var(--serif);letter-spacing:-.045em;margin:20px 0 22px;max-width:760px}h2{font:350 clamp(27px,3vw,40px)/1.15 var(--serif);letter-spacing:-.025em}h3{font:500 14px var(--sans)}.intro{max-width:690px;font-size:18px;line-height:1.75;color:#c9c5cf}.meta{font:400 12px var(--mono);color:var(--muted);margin-top:24px}.areas{display:flex;flex-wrap:wrap;gap:8px 25px;margin-top:27px;padding-top:22px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.project{margin-top:48px}.project__head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:18px}.project__head span{font:400 11px var(--mono);color:var(--muted)}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:16px}.screen{display:block;overflow:hidden;border:1px solid var(--line);border-radius:5px;background:#fff}.screen img{aspect-ratio:1.42;object-fit:contain;object-position:top;background:#fff;transition:opacity .2s}.screen:hover img{opacity:.88}.gallery--wide{grid-template-columns:1fr}.gallery--wide img{aspect-ratio:auto}.note{font:400 11px/1.6 var(--mono);color:var(--muted);margin-top:48px;padding-top:20px;border-top:1px solid var(--line)}.galleryIntro{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin:40px 0 50px}.galleryIntro .intro{font-size:16px}.galleryIntro h1{font-size:58px;margin:0}.galleryLead{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-top:30px;align-items:center}.galleryLead .screen:first-child{grid-row:span 2}.galleryLead .screen:first-child img{aspect-ratio:1.1;object-fit:cover;object-position:top left}.galleryLead .screen img{aspect-ratio:1.75;object-fit:cover;object-position:top}.clientLine{font:400 12px var(--mono);color:var(--muted);margin-top:15px}.profile{display:grid;grid-template-columns:1fr 1.2fr;gap:48px;margin:40px 0 52px;padding:30px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.profile p{font-size:16px;color:var(--muted);margin-top:14px}.tasks{list-style:none;margin:0;padding:0}.tasks li{padding:15px 0;border-bottom:1px solid var(--line);font-size:14px;color:#c9c5cf}.tasks li:first-child{padding-top:0}.tasks li:last-child{border-bottom:0;padding-bottom:0}.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.thumbs h3{margin:14px 0 0;font-size:13px}.thumbs img{aspect-ratio:1.2;object-fit:cover;object-position:top left}.more{margin-top:20px}.more summary{cursor:pointer;padding:10px 0;color:var(--muted);font-size:13px}.more .gallery{margin-top:15px}.footer{width:min(1100px,100% - 48px);margin:0 auto 35px;font-size:12px;color:var(--muted)}
@media(max-width:700px){.choices{gap:7px}.choice{padding:12px 10px}.choice b{font-size:12px}.choice small{font-size:10px}.review{padding:18px 16px}.canvas{width:calc(100% - 24px);margin-top:18px;padding:25px 20px}.intro{font-size:16px}.project{margin-top:38px}.gallery{grid-template-columns:1fr}.project__head{display:block}.project__head span{display:block;margin-top:7px}.galleryIntro,.profile{grid-template-columns:1fr;gap:24px}.galleryIntro h1{font-size:46px}.galleryLead{gap:9px;grid-template-columns:1fr 1fr}.galleryLead .screen:first-child{grid-column:1/-1;grid-row:auto}.galleryLead .screen:first-child img{aspect-ratio:1.42;object-fit:contain}.thumbs{grid-template-columns:1fr}.thumbs img{aspect-ratio:1.42;object-fit:contain}.footer{width:calc(100% - 40px)}}
.projectProfile{margin-top:58px;padding-top:32px;border-top:1px solid var(--line)}.projectProfile__intro{display:grid;grid-template-columns:1fr 1.2fr;gap:40px;margin-bottom:28px}.projectProfile__intro .eyebrow{margin-bottom:12px}.projectProfile__intro h2{margin-bottom:14px}.projectProfile__intro .context{font-size:13px;color:var(--muted)}.projectProfile .tasks li{padding:10px 0;font-size:14px}.flowBar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:25px 0 14px}.flowBar p{font:400 11px var(--mono);color:var(--muted)}.flowControls{display:flex;gap:8px}.flowControls button{width:38px;height:38px;background:transparent;border:1px solid var(--line);border-radius:50%;font-size:19px}.flowControls button:hover{border-color:var(--accent)}.flow{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-color:#66606d transparent;padding:2px 1px 18px;overscroll-behavior-x:contain}.flow figure{flex:0 0 min(390px,82%);min-width:0;scroll-snap-align:start;position:relative}.flow figure:not(:last-child)::after{content:'→';position:absolute;right:-17px;top:35%;color:var(--accent)}.flow figcaption{display:flex;align-items:baseline;gap:12px;padding:13px 1px 0;font-size:13px}.flow figcaption span{font:400 11px var(--mono);color:var(--accent)}.flow figcaption strong{font-weight:500}.flowGroup+.flowGroup{margin-top:25px}.additional{margin-top:60px;padding:30px 0 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1.2fr;gap:40px}.additional h2{font-size:29px}.projectIndex{display:flex;gap:12px 30px;flex-wrap:wrap;padding-top:24px;margin-top:30px;border-top:1px solid var(--line)}.projectIndex a{font:400 12px var(--mono);color:var(--muted);text-decoration:none;padding:7px 0}.projectIndex a:hover{color:var(--accent)}.projectProfile{scroll-margin-top:24px}
@media(max-width:700px){.projectProfile__intro,.additional{grid-template-columns:1fr;gap:22px}.projectProfile{margin-top:40px;padding-top:25px}.flow{gap:16px}.flow figure{flex-basis:88%}.flow figure:not(:last-child)::after{right:-14px}.projectIndex{gap:6px 19px}.projectIndex a{font-size:11px}.flowBar{gap:10px}.flowBar p{max-width:210px;line-height:1.6}.additional{margin-top:42px}}

<body>
<header class="review"><div class="review__top"><p id="reviewLabel"></p><button class="lang" id="language" type="button">EN</button></div><nav class="choices" aria-label="Aufbauvarianten"><button class="choice" data-variant="a" aria-pressed="true" type="button"></button><button class="choice" data-variant="b" aria-pressed="false" type="button"></button><button class="choice" data-variant="c" aria-pressed="false" type="button"></button></nav><p class="rationale" id="rationale"></p></header>
<main class="canvas" id="canvas"></main><footer class="footer"><a href="index.html" id="back"></a></footer>
<script>
const copy={de:{review:'Arbeitsvorschau / forwerts',names:['A · Überblick','B · Galerie','C · Tätigkeitsprofil'],short:['Kompakter Überblick','Bilder zuerst','Aufgaben & Screenfolgen'],why:['Eine gemeinsame Beschreibung der Tätigkeit, danach die drei Projekte mit schlichten Namen und Screens. Eine kompakte Alternative.','Die Screens stehen am Anfang. Der Text bleibt auf einen kurzen Absatz und gemeinsame Tätigkeitsfelder begrenzt.','Die belegten Tätigkeitsfelder erhalten mehr Gewicht. Die Kundenprojekte folgen als kompakte Bildauswahl.'],intro:'Bei forwerts interactive arbeitete ich im UX Design an verschiedenen Kundenprojekten, darunter für 1&1 und Vattenfall.',expanded:'Meine Tätigkeit umfasste die Ausarbeitung von Screen-Designs, die Exploration von Funnel-Flows und Funktionalitäten sowie die Mitarbeit an Designstrukturen im Online-Shop- und Kunden-Center-Kontext.',areas:['Screen-Design','Funnel-Flows','Designstrukturen','Icons & Infografiken'],meta:'UX Design · September 2024 bis Februar 2025',projects:['1&1 Online-Shop','1&1 Hilfe-Center','Vattenfall'],labels:['E-Commerce','Kundenservice','Website'],note:'Öffentliche Website-Ansichten, aufgenommen im September 2026. Die Screens dienen der Einordnung der Kundenprojekte.',tasksTitle:'Tätigkeitsfelder',tasks:['Screen-Designs im Rahmen bestehender Oberflächenkonzepte','Ideenfindung und Ausarbeitung von Funnel-Flows und Funktionalitäten','Icons, Infografiken und Badges für Shop- und Kunden-Center-Bereiche','Mitarbeit am Aufbau von Designstrukturen'],more:'Weitere Screens',back:'Zurück zum Portfolio'},en:{review:'Working preview / forwerts',names:['A · Overview','B · Gallery','C · Role profile'],short:['Compact overview','Images first','Tasks & screen sequences'],why:['One shared description of the role, followed by the three projects with simple names and screenshots. A compact alternative.','Screenshots come first. Copy is limited to a short paragraph and shared areas of work.','The documented areas of work take more space. Client projects follow as a compact image selection.'],intro:'At forwerts interactive, I worked in UX design on various client projects, including projects for 1&1 and Vattenfall.',expanded:'My work included screen design, the exploration of funnel flows and functionality, and contributing to design structures for online shops and customer centres.',areas:['Screen design','Funnel flows','Design structures','Icons & infographics'],meta:'UX Design · September 2024 to February 2025',projects:['1&1 Online Shop','1&1 Help Center','Vattenfall'],labels:['E-commerce','Customer service','Website'],note:'Public website views captured in September 2026. The screenshots provide context for the client projects.',tasksTitle:'Areas of work',tasks:['Screen designs within existing interface concepts','Ideation and development of funnel flows and functionality','Icons, infographics and badges for shop and customer centre interfaces','Contributing to the development of design structures'],more:'More screenshots',back:'Back to portfolio'}};
let language='de',variant='c';
const profiles={de:{why:'Tätigkeitsfelder je Kundenprojekt, ergänzt durch seitlich scrollbare Screens. Übergreifende Aufgaben stehen am Ende.',scope:'Tätigkeitsfelder',flow:'Öffentliche Website-Ansichten',hint:'Screens · seitlich scrollen',prev:'Vorherige Screens',next:'Weitere Screens',other:'Weitere Aufgaben',otherTasks:['Erstellung von Icons, Infografiken und Badges im Online-Shop- und Kunden-Center-Kontext','Grafische Ausarbeitung von Ideen und Entwicklung von Textvorschlägen'],contexts:['Bestellprozess und Zubehör','Seiten und Unterseiten','Webseitenstruktur und Seitenaufbau'],tasks:[['Mitarbeit an User Flows im Bestellprozess','Optimierung der Zubehörstufe im Bestellverlauf','Ausarbeitung von Screen-Designs und Funktionsideen'],['Konzeption und Überarbeitung von Seiten und Unterseiten','Mitarbeit an der Informations- und Designstruktur des Hilfe-Centers'],['Aufbereitung und Darstellung der Webseitenstruktur','Mitarbeit am grundlegenden Seitenaufbau']],steps:[['Gerät','Laufzeit','Tarif','Watch','Tauschprämie','Zubehör','Warenkorb'],['Startseite','Themenfeld','Unterthema','Hilfeartikel'],['Tarifübersicht','Tarifdetail','Serviceübersicht','Servicedetail']],groups:['Tarifseiten','Serviceseiten']},en:{why:'Areas of work for each client project, followed by horizontally scrolling screenshots. Shared tasks appear at the end.',scope:'Areas of work',flow:'Public website views',hint:'screens · scroll sideways',prev:'Previous screens',next:'More screens',other:'Additional tasks',otherTasks:['Creation of icons, infographics and badges for online shops and customer centres','Visual development of ideas and copy suggestions'],contexts:['Order process and accessories','Pages and subpages','Website structure and page layouts'],tasks:[['Contributing to user flows in the order process','Optimising the accessories step in the order journey','Developing screen designs and feature ideas'],['Concept and revision of pages and subpages','Contributing to the information and design structure of the Help Center'],['Mapping and presenting the website structure','Contributing to the fundamental page layouts']],steps:[['Device','Contract term','Plan','Watch','Trade-in','Accessories','Basket'],['Landing page','Topic','Subtopic','Help article'],['Plan overview','Plan detail','Service overview','Service detail']],groups:['Plan pages','Service pages']}};
const flowFiles=[['shop-produkt','shop-laufzeit','shop-tarif','shop-watch','shop-tauschpraemie','shop-zubehoer','shop-warenkorb'],['hilfe-start','hilfe-thema','hilfe-unterthema','hilfe-artikel'],['vattenfall-tarife','vattenfall-oekostrom','vattenfall-service','vattenfall-detail']];
function flowMarkup(files,labels,id,title){const p=profiles[language];return `<div class="flowGroup"><div class="flowBar"><p>${title} · ${files.length} ${p.hint}</p><div class="flowControls"><button type="button" data-flow="${id}" data-dir="-1" aria-label="${p.prev}">←</button><button type="button" data-flow="${id}" data-dir="1" aria-label="${p.next}">→</button></div></div><div class="flow" id="${id}" tabindex="0" role="region" aria-label="${title}">${files.map((f,k)=>`<figure>${screen(f,labels[k])}<figcaption><span>${String(k+1).padStart(2,'0')}</span><strong>${labels[k]}</strong></figcaption></figure>`).join('')}</div></div>`}
const sets=[['shop-zubehoer','shop-tarif','shop-warenkorb'],['hilfe-start','hilfe-thema','hilfe-artikel'],['vattenfall-oekostrom','vattenfall-detail','vattenfall-service']];
function screen(file,label){return `<a class="screen" href="assets/img/case-studies/${file}.jpg" target="_blank" rel="noopener"><img src="assets/img/case-studies/${file}.jpg" alt="${label}" loading="lazy"></a>`}
function render(){const t=copy[language],i=['a','b','c'].indexOf(variant);document.documentElement.lang=language;document.querySelector('#reviewLabel').textContent=t.review;document.querySelector('#language').textContent=language==='de'?'EN':'DE';document.querySelector('#rationale').textContent=t.why[i];document.querySelector('#back').textContent=t.back;document.querySelectorAll('[data-variant]').forEach((b,n)=>{b.innerHTML=`<b>${t.names[n]}</b><small>${t.short[n]}</small>`;b.setAttribute('aria-pressed',b.dataset.variant===variant)});
const areas=`<div class="areas">${t.areas.map(x=>`<span>${x}</span>`).join('')}</div>`,note=`<p class="note">${t.note}</p>`,header=`<p class="eyebrow">User Experience Design</p><h1>forwerts interactive</h1><p class="intro">${t.intro}</p><p class="meta">${t.meta}</p>`;
let html='';
if(variant==='a'){html=header+areas+sets.map((s,n)=>`<section class="project"><div class="project__head"><h2>${t.projects[n]}</h2><span>${t.labels[n]}</span></div><div class="gallery">${s.slice(0,2).map(f=>screen(f,t.projects[n])).join('')}</div><details class="more"><summary>${t.more}</summary><div class="gallery">${screen(s[2],t.projects[n])}</div></details></section>`).join('')+note;}
if(variant==='b'){html=`<p class="eyebrow">forwerts interactive / UX Design</p><div class="galleryLead">${screen(sets[0][0],t.projects[0])+screen(sets[1][0],t.projects[1])+screen(sets[2][0],t.projects[2])}</div><p class="clientLine">1&1 Online-Shop · 1&1 Hilfe-Center · Vattenfall</p><div class="galleryIntro"><h1>forwerts interactive</h1><div><p class="intro">${t.intro}</p><p class="meta">${t.meta}</p></div></div>${areas}<div class="gallery project">${screen(sets[0][1],t.projects[0])+screen(sets[2][1],t.projects[2])}</div>${note}`;}
if(variant==='c'){const p=profiles[language];document.querySelector('#rationale').textContent=p.why;html=header+`<nav class="projectIndex" aria-label="${t.tasksTitle}">${t.projects.map((name,n)=>`<a href="#profile-${n}">${name} ↘</a>`).join('')}</nav>`+t.projects.map((name,n)=>`<section class="projectProfile" id="profile-${n}"><div class="projectProfile__intro"><div><p class="eyebrow">${String(n+1).padStart(2,'0')} / ${t.labels[n]}</p><h2>${name}</h2><p class="context">${p.contexts[n]}</p></div><ul class="tasks">${p.tasks[n].map(task=>`<li>${task}</li>`).join('')}</ul></div>${n===2?flowMarkup(flowFiles[n].slice(0,2),p.steps[n].slice(0,2),'flow-tarife',p.groups[0])+flowMarkup(flowFiles[n].slice(2),p.steps[n].slice(2),'flow-service',p.groups[1]):flowMarkup(flowFiles[n],p.steps[n],'flow-'+n,p.flow)}</section>`).join('')+`<section class="additional"><h2>${p.other}</h2><ul class="tasks">${p.otherTasks.map(task=>`<li>${task}</li>`).join('')}</ul></section>`+note;}
document.querySelector('#canvas').innerHTML=html;document.querySelectorAll('[data-flow]').forEach(button=>button.addEventListener('click',()=>{const row=document.getElementById(button.dataset.flow);const card=row.querySelector('figure');row.scrollBy({left:Number(button.dataset.dir)*(card.getBoundingClientRect().width+parseFloat(getComputedStyle(row).gap)),behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}));}
document.querySelectorAll('[data-variant]').forEach(b=>b.addEventListener('click',()=>{variant=b.dataset.variant;render()}));document.querySelector('#language').addEventListener('click',()=>{language=language==='de'?'en':'de';render()});render();
</script>
